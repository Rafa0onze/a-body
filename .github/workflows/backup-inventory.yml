name: Backup inventory

on:
  push:
    paths:
      - ".github/workflows/backup-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-backups:
    runs-on: ubuntu-latest
    steps:
      - name: List Supabase backups
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: zvmriqxigpwuggyhpoun
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $SUPABASE_TOKEN"             "https://api.supabase.com/v1/projects/$PROJECT_REF/database/backups"             | jq . > backups.json
      - uses: actions/upload-artifact@v4
        with:
          name: backup-inventory
          path: backups.json
